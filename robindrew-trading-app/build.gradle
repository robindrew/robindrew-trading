
// IMPORT JAVA LIBRARY CONFIG
apply from: "$rootDir/gradle/java-application.gradle"

// DEPENDENCIES (Which JAR files to download and host locally)
dependencies {

	// COMMON
	implementation project(":robindrew-trading-core")
	implementation "com.robindrew:robindrew-common:${version_robindrew_core}"
	implementation "com.google.guava:guava:${version_guava}"
	implementation "org.apache.commons:commons-lang3"

	// SPRING
	implementation "org.apache.commons:commons-lang3"
	implementation "org.springframework.boot:spring-boot-starter-web"
	implementation "org.springframework.boot:spring-boot-starter-actuator"
	implementation "org.springframework.boot:spring-boot-starter-validation"
	implementation "org.springframework.boot:spring-boot-starter-security"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${version_springdoc_webmvc}"

	// MEDIA
	implementation "org.jcodec:jcodec-javase:0.2.5"
	implementation "org.jcodec:jcodec:0.2.5"
	implementation "com.madgag:animated-gif-lib:1.4"

	// TESTING
	testImplementation "org.springframework.boot:spring-boot-starter-test"
}
