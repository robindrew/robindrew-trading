apply plugin: 'maven-publish'

publishing {
    publications {
        mavenJava(MavenPublication) {
            // Configure the artifact to be published
            from components.java
        }
    }
    repositories {
        maven {
            // Your private Maven repository URL
            // Replace with your actual repository URL
            url = uri("https://maven.pkg.github.com/robindrew/robindrew-services")

            // Authentication for your private repository
            credentials {
                // Use environment variables or project properties for credentials
                // These will be picked up from the GitHub Secrets passed as environment variables
                username System.getenv("MAVEN_USERNAME").toString() ?: project.findProperty("mavenUsername").toString()
                password System.getenv("MAVEN_PASSWORD").toString() ?: project.findProperty("mavenPassword").toString()
            }
        }
    }
}
